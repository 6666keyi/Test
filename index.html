<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The Meta Redirect: Forces the /main.html suffix immediately -->
    <meta http-equiv="refresh" content="0; url=./main.html" />
    <title>NYC Rent & Sale Calculators</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --text: #333;
            --bg: #f4f7f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--primary); }
        p { color: #666; margin-bottom: 1.5rem; }
        
        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>Loading Calculators...</h1>
        <p>We're taking you to the NYC Real Estate dashboard.</p>
        <p>If you are not redirected, <a href="./main.html">click here to enter</a>.</p>
    </div>

    <script>
        // Backup JavaScript redirect in case the meta tag fails
        window.location.href = "./main.html";
    </script>
</body>
</html>
